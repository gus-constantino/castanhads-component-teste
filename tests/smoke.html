  tr.ko td{ background:var(--common-colors-feedback-negative-soft); }
  /* Os componentes são montados aqui, fora da tela, num frame de 600px como o playground (Fluido) */

  .frame{ width:600px; display:flex; flex-direction:column; align-items:center; }
  .frame > div{ width:100%; display:flex; justify-content:center; }
