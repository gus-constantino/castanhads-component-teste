<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Castanha DS — Playground</title>
<meta name="description" content="Playground de componentes do Castanha DS." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

<!-- Fundação -->
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/shared.css" />
<!-- Componentes -->
<link rel="stylesheet" href="components/code-input-otp/code-input-otp.css" />
<link rel="stylesheet" href="components/credit-card-input/credit-card-input.css" />
<!-- Shell do playground -->
<link rel="stylesheet" href="styles/playground.css" />
</head>
<body>

<header class="pg-header">
  <p class="pg-brand">Castanha DS <span>Playground de componentes</span></p>
  <button class="pg-iconbtn" id="theme" type="button" aria-label="Ativar tema escuro" aria-pressed="false" title="Alternar tema">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
  </button>
</header>

<div class="pg-shell">
  <nav class="pg-sidebar" aria-label="Componentes">
    <input class="pg-search" id="search" type="search" placeholder="Buscar componente" aria-label="Buscar componente" autocomplete="off" />
    <p class="pg-nav-title">Componentes</p>
    <ul class="pg-nav" id="nav"></ul>
  </nav>

  <main class="pg-canvas">
    <div class="pg-toolbar">
      <div>
        <h1 id="cmp-title"></h1>
        <div class="pg-links" id="cmp-links"></div>
      </div>
      <div id="viewport"></div>
    </div>
    <div class="pg-stage">
      <div class="pg-frame" id="frame">
        <div class="pg-frame-meta"><span>Viewport: <code id="vp-readout">fluido</code></span><span>Valor: <code id="rval">—</code> <span id="rdone"></span></span></div>
        <div class="pg-preview" id="preview"></div>
      </div>
    </div>
  </main>

  <aside class="pg-panel" aria-label="Controles">
    <h2>Controles</h2>
    <div id="panel"></div>
  </aside>
</div>

<!-- Kit do playground (registro + controles) -->
<script src="scripts/playground-kit.js"></script>
<!-- Componentes: definição do custom element + playground -->
<script src="components/code-input-otp/code-input-otp.js"></script>
<script src="components/code-input-otp/code-input-otp.playground.js"></script>
<script src="components/credit-card-input/credit-card-input.js"></script>
<script src="components/credit-card-input/credit-card-input.playground.js"></script>
<!-- Shell: side menu, rotas, tema, viewport -->
<script src="scripts/app.js"></script>
</body>
</html>
